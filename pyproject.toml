[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skipper"
dynamic = ["version"]
description = "Find intro, recap and credits timestamps for TV and anime episode files"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Md Asif" }]
requires-python = ">=3.11"
dependencies = [
  "guessit",
]

[project.urls]
Homepage = "https://github.com/anisthdev/skipper"

[project.scripts]
skipper = "skipper.cli:main"

[tool.hatch.version]
path = "skipper/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["skipper", "tests", "mpv", "README.md", "LICENSE", "config.example.toml"]
